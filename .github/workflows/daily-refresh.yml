name: Daily Data Refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-refresh.yml"
      - "scripts/generate_peopleops_data.py"
      - "scripts/refresh_work_location.py"
      - "services/work_location_store.py"
  schedule:
    - cron: "30 3 * * *"  # 9:00 AM IST every day
  workflow_dispatch:       # allow manual trigger from GitHub UI

concurrency:
  group: daily-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GREYTHR_DOMAIN: ${{ secrets.GREYTHR_DOMAIN }}
      GREYTHR_USERNAME: ${{ secrets.GREYTHR_USERNAME }}
      GREYTHR_PASSWORD: ${{ secrets.GREYTHR_PASSWORD }}
      WORKLOGIX_BASE_URL: ${{ secrets.WORKLOGIX_BASE_URL }}
      WORKLOGIX_EMAIL: ${{ secrets.WORKLOGIX_EMAIL }}
      WORKLOGIX_PASSWORD: ${{ secrets.WORKLOGIX_PASSWORD }}
      TEAMS_TENANT_ID: ${{ secrets.TEAMS_TENANT_ID }}
      TEAMS_CLIENT_ID: ${{ secrets.TEAMS_CLIENT_ID }}
      TEAMS_CLIENT_SECRET: ${{ secrets.TEAMS_CLIENT_SECRET }}
      GRAPH_TENANT_ID: ${{ secrets.TEAMS_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh GreytHR work-location attendance
        # Required before KPI generation: profiles and KPIs must use the same verified attendance cache.
        run: python scripts/refresh_work_location.py --month $(date -u +%Y-%m)

      - name: Generate PeopleOps data
        run: python scripts/generate_peopleops_data.py --month $(date -u +%Y-%m)

      - name: Refresh Teams data
        run: python scripts/refresh_teams.py

      - name: Refresh org hierarchy
        # Builds data/org-hierarchy.json (manager/reports tree) from the teamsId links
        # refresh_teams.py just updated. Not safe to skip on error: a stale org chart
        # silently breaks team-scoped access control, so a failure here fails the run.
        run: python scripts/refresh_org_hierarchy.py

      - name: Refresh GitHub data
        run: python scripts/refresh_github.py --month $(date -u +%Y-%m)

      - name: Commit and push core data
        # Publish KPI and attendance before optional enrichments so a slow external
        # service cannot keep the dashboard on yesterday's generated file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add data/peopleops-data.json data/github-data.json data/org-hierarchy.json
          git diff --staged --quiet || git commit -m "chore: refresh core PeopleOps data [skip ci]"
          git push

      - name: Refresh Graph activity data
        # Graph/SharePoint occasionally returns a transient HTTP 500. Its enrichment is
        # optional and must not discard successfully generated KPI and attendance data.
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/refresh_graph_activity.py --month $(date -u +%Y-%m)

      - name: Refresh leave types
        # Optional extra for the "Type of leaves taken" card. A GreytHR hiccup here must never block the rest of the refresh.
        continue-on-error: true
        run: python scripts/refresh_leave_types.py

      - name: Commit and push optional enrichment data
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add data/peopleops-data.json data/graph-activity.json
          # only if the leave step produced files; a missing path would make git add fail the whole step
          if [ -d data/leave ]; then git add data/leave; fi
          git diff --staged --quiet || git commit -m "chore: refresh optional PeopleOps data [skip ci]"
          git push
