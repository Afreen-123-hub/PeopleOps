<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeopleOPS Intelligence – Sign In</title>
  <link rel="icon" type="image/svg+xml" href="peopleops-icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f9;
      padding: 24px;
    }

    /* Subtle teal gradient strip at top */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #0F766E 0%, #14B8A6 100%);
    }

    /* ── Card ──────────────────────────────────────── */
    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow:
        0 1px 3px rgba(15,28,46,0.06),
        0 8px 24px rgba(15,28,46,0.09),
        0 24px 56px rgba(15,28,46,0.08);
      padding: 48px 44px 40px;
      width: 100%;
      max-width: 420px;
    }

    /* ── Logo ──────────────────────────────────────── */
    .card-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }

    /* ── Heading ───────────────────────────────────── */
    .card-heading {
      text-align: center;
      margin-bottom: 28px;
    }
    .card-heading h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f1c2e;
      letter-spacing: -0.02em;
      margin-bottom: 5px;
    }
    .card-heading p {
      font-size: 0.84rem;
      color: #64748b;
      line-height: 1.5;
    }

    /* ── Microsoft button ──────────────────────────── */
    .ms-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      background: #fff;
      color: #1a1a1a;
      border: 1.5px solid #d1d9e6;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .ms-btn:hover {
      border-color: #0078d4;
      background: #fafcff;
      box-shadow: 0 0 0 3px rgba(0,120,212,0.1);
    }

    /* ── Divider ───────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 0.77rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .divider::before,
    .divider::after { content: ''; flex: 1; height: 1px; background: #e8edf4; }

    /* ── Fields ────────────────────────────────────── */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      font-size: 0.92rem;
      background: #f8fafc;
      color: #0f1c2e;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .field input:focus {
      border-color: #0F766E;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(15,118,110,0.12);
    }

    /* ── Submit button ─────────────────────────────── */
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #0F766E;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      font-family: inherit;
      letter-spacing: 0.01em;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .submit-btn:hover { background: #0d6560; box-shadow: 0 4px 14px rgba(15,118,110,0.32); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    /* ── Messages ──────────────────────────────────── */
    .msg {
      display: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.84rem;
      margin-top: 12px;
      font-weight: 600;
    }
    .msg-error   { background: #fff0f1; color: #c0192b; border: 1px solid #fcd0d4; }
    .msg-success { background: #f0fff4; color: #1a7f4b; border: 1px solid #b2f2cb; }

    /* ── Footer ────────────────────────────────────── */
    .card-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f0f4f8;
      text-align: center;
      font-size: 0.72rem;
      color: #94a3b8;
    }
  </style>
</head>

      </svg>
    </div>

    <div class="card-heading">
      <h1>Sign in</h1>
      <p>Enter your credentials to access the dashboard</p>
    </div>

    <!-- Microsoft SSO -->
    <a href="/auth/login" class="ms-btn" id="msBtn">
      <svg width="20" height="20" viewBox="0 0 21 21">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Sign in with Microsoft
    </a>

    <div class="divider">or</div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required placeholder="Your username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password" />
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">Sign in</button>
    </form>

    <div class="msg msg-error"   id="errorMsg"></div>
    <div class="msg msg-success" id="successMsg"></div>

    <div class="card-footer">© 2026 Codework · PeopleOps Intelligence</div>
  </div>

  <script>
    // Already logged in → skip straight to dashboard
    (async function checkExistingSession() {
      const token = localStorage.getItem("po_token");
      if (!token) return;
      try {
        const res = await fetch("/api/health", { headers: { "Authorization": "Bearer " + token } });
        if (res.ok) {
          window.location.href = "index.html";
        } else {
          localStorage.removeItem("po_token");
        }
      } catch { /* server unreachable, stay on login */ }
    })();

    // SSO callback: ?sso_token=...&sso_name=...
    (function handleSsoCallback() {
      const params   = new URLSearchParams(window.location.search);
      const ssoToken = params.get("sso_token");
      const ssoName  = params.get("sso_name");
      const error    = params.get("error");

      if (ssoToken) {
        localStorage.setItem("po_token", ssoToken);
        const name = ssoName ? decodeURIComponent(ssoName) : "there";
        const el = document.getElementById("successMsg");
        el.textContent = "Welcome, " + name + "! Loading dashboard...";
        el.style.display = "block";
        // Go to splash which then loads the dashboard
        setTimeout(() => { window.location.href = "splash.html"; }, 600);
        return;
      }

      if (error) {
        const el = document.getElementById("errorMsg");
        el.textContent = decodeURIComponent(error);
        el.style.display = "block";
        history.replaceState(null, "", window.location.pathname);
      }
    })();

    // Password form
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn      = document.getElementById("loginBtn");
      const err      = document.getElementById("errorMsg");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled    = true;
      btn.textContent = "Signing in...";
      err.style.display = "none";

      try {
        const res  = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem("po_token", data.token);
          // Login → splash → dashboard
          window.location.href = "splash.html";
        } else {
          err.textContent   = data.error || "Invalid username or password.";
          err.style.display = "block";
          btn.disabled      = false;
          btn.textContent   = "Sign in";
        }
      } catch {
        err.textContent   = "Could not reach the server. Make sure the backend is running.";
        err.style.display = "block";
        btn.disabled      = false;
        btn.textContent   = "Sign in";
      }
    });
  </script>
</body>
</html>
