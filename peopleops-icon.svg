<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="poiGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F5CFF"/>
      <stop offset="100%" stop-color="#00C2A8"/>
    </linearGradient>
  </defs>

  <!-- connecting lines: three signals converging into the core -->
  <line x1="32" y1="32" x2="32" y2="9"  stroke="url(#poiGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="51.6" y2="44" stroke="url(#poiGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="12.4" y2="44" stroke="url(#poiGrad)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- outer signal nodes -->
  <circle cx="32" cy="9" r="5.5" fill="white" stroke="url(#poiGrad)" stroke-width="2.6"/>
  <circle cx="51.6" cy="44" r="5.5" fill="white" stroke="url(#poiGrad)" stroke-width="2.6"/>
  <circle cx="12.4" cy="44" r="5.5" fill="white" stroke="url(#poiGrad)" stroke-width="2.6"/>

  <!-- core: the fused score -->
  <circle cx="32" cy="32" r="12" fill="url(#poiGrad)"/>
  <circle cx="32" cy="32" r="4" fill="white"/>
</svg>
