<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeopleOPS Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="peopleops-icon.svg">
  <noscript><meta http-equiv="refresh" content="0;url=login.html"></noscript>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      overflow: hidden;
    }
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b1f4d 0%, #0d3a5f 55%, #0d6d64 100%);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .splash.leaving { opacity: 0; transform: scale(1.04); }
    .splash-mark { width: min(22vw, 220px); height: min(22vw, 220px); }
    .splash-mark path {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: draw 0.9s ease forwards;
    }
    .splash-mark path:nth-child(1) { animation-delay: 0.1s; }
    .splash-mark path:nth-child(2) { animation-delay: 0.22s; }
    .splash-mark path:nth-child(3) { animation-delay: 0.34s; }
    .splash-mark path:nth-child(4) { animation-delay: 0.46s; }
    .splash-mark circle.core {
      opacity: 0;
      transform: scale(0);
      transform-origin: 32px 32px;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.75s;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { to { opacity: 1; transform: scale(1); } }
    .splash-word {
      margin-top: clamp(20px, 3vw, 40px);
      text-align: center;
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.5s ease forwards;
      animation-delay: 1.05s;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .splash-word strong { display: block; font-size: clamp(1.8rem, 4vw, 3.2rem); font-weight: 800; letter-spacing: -0.01em; }
    .splash-word span { display: block; font-size: clamp(0.85rem, 1.4vw, 1.15rem); color: #8fd9ce; font-weight: 600; margin-top: 6px; letter-spacing: 0.06em; }
    .splash-status {
      margin-top: clamp(28px, 4vw, 52px);
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.65);
      font-size: clamp(0.8rem, 1vw, 0.95rem);
      font-weight: 600;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
      animation-delay: 1.3s;
    }
    .splash-status .dots { display: flex; gap: 5px; }
    .splash-status .dots span { width: 6px; height: 6px; border-radius: 50%; background: #5eead4; animation: bounce 1.1s ease-in-out infinite; }
    .splash-status .dots span:nth-child(2) { animation-delay: 0.15s; }
    .splash-status .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <svg class="splash-mark" viewBox="0 0 64 64" fill="none">
      <path d="M10 13 Q26 13 32 32" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".9"/>
      <path d="M54 13 Q38 13 32 32" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".9"/>
      <path d="M10 51 Q26 51 32 32" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".9"/>
      <path d="M54 51 Q38 51 32 32" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".9"/>
      <circle class="core" cx="32" cy="32" r="12" fill="#fff"/>
      <circle class="core" cx="32" cy="32" r="4" fill="#0f7a72" style="animation-delay:.85s"/>
    </svg>
    <div class="splash-word"><strong>PeopleOps</strong><span>INTELLIGENCE</span></div>
    <div class="splash-status"><div class="dots"><span></span><span></span><span></span></div>Preparing your workspace</div>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("splash").classList.add("leaving");
      setTimeout(() => { window.location.href = "login.html"; }, 550);
    }, 2000);
  </script>
</body>
</html>
